# Refresh published EPG after user uploads a new XMLTV gzip snapshot.
name: Publish SS IPTV EPG

on:
  workflow_dispatch:
  push:
    paths:
      - 'input/epg-lite.xml.gz'
      - 'build_epg.py'
      - '.github/workflows/publish-epg.yml'
      - 'site/bcu-epg-test.m3u'
  # No schedule: upstream blocks programmatic downloads (Cloudflare).

permissions:
  contents: read

concurrency:
  group: pages-epg
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public EPG-only repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install XML parser
        run: python -m pip install "lxml>=5,<7"
      - name: Build filtered EPG from uploaded browser snapshot
        run: python build_epg.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload EPG-only Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy XMLTV to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
